name: HF Space Ping

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up API
        run: |
          STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" \
            --retry 5 \
            --retry-delay 15 \
            --retry-all-errors \
            "https://yezdata-pydocs-ai-api.hf.space/get_tables")
          echo "API Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then exit 1; fi

      - name: Wake up Frontend
        run: |
          STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" \
            --retry 5 \
            --retry-delay 15 \
            --retry-all-errors \
            "https://yezdata-pydocs-ai.hf.space")
          echo "Frontend Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then exit 1; fi

